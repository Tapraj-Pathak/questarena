services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: questarena
      POSTGRES_USER: questarena
      POSTGRES_PASSWORD: questarena
    ports:
      - "5432:5432"
    volumes:
      - questarena_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questarena -d questarena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questarena_postgres:
